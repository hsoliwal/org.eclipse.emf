name: EMF verification build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, 'release/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The JUnit XML producer for the verify jobs below is the Tycho 5.0.4 OSGi
# booter rebuilt around the corrected Apache Surefire 3.5.6 StatelessXmlReporter.
# Stock 3.5.6 declares one test per method name while writing one <testcase>
# per execution, so a name reported skipped and then passed got a header of
# one test fewer than its testcases. The sealed correction is read from GEF
# (hsoliwal/gef-classic tests/m3/surefire356-authentic at the pinned commit).
# The strict SWT verifier pin below stays unchanged; it checks the corrected
# reports. Evidence: docs/m3/release/JUNIT-REPORT-PRODUCER-20261125.md
env:
  CORRECTION_SOURCE: b559af293c0903b22c76e418a9346e65b99a887c
  SUREFIRE_SOURCE: 25ea054860a5c1e5932b360d8aa0a31944c2b841
  TYCHO_SOURCE: c4349ee27dfde2817dfc7121b5f84bfb9eeb0195
  REPORT_PRODUCER_BOOTER_SHA256: 73c9822161a262d9f8fa3169219f15be316a73b6f9df8ea94210eb22939a42cc
  REPORT_PRODUCER_POM_SHA256: a1101fdfbdd5d2a6dde3d0a7738e3a7b98164f5b7d8bb091586a6e8d304de312
  REPORT_PRODUCER_REPORTER_SHA256: cdd12416d7e9a0e18795f95747f28b945b7ee0f542f6f8c1d86f1ab86d97152a

jobs:
  report-producer:
    name: Corrected Surefire 3.5.6 reporter in the Tycho 5.0.4 booter
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Check out the sealed reporter correction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hsoliwal/gef-classic
          ref: ${{ env.CORRECTION_SOURCE }}
          path: correction
          sparse-checkout: tests/m3/surefire356-authentic
          persist-credentials: false
      - name: Check out Apache Surefire 3.5.6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apache/maven-surefire
          ref: ${{ env.SUREFIRE_SOURCE }}
          path: upstream-surefire
          persist-credentials: false
      - name: Check out Tycho 5.0.4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eclipse-tycho/tycho
          ref: ${{ env.TYCHO_SOURCE }}
          path: upstream-tycho
          persist-credentials: false
      - name: Set up Java 21 without a shared Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.9.12
      - name: Admit the exact upstream sources and apply only the sealed correction
        run: |
          set -euo pipefail
          echo "PRODUCER_M2=$RUNNER_TEMP/report-producer-m2" >> "$GITHUB_ENV"
          echo "PRODUCER_OUT=$RUNNER_TEMP/report-producer" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/report-producer"
          test "$(git -C correction rev-parse HEAD)" = "$CORRECTION_SOURCE"
          test "$(git -C upstream-surefire rev-parse HEAD)" = "$SUREFIRE_SOURCE"
          test "$(git -C upstream-tycho rev-parse HEAD)" = "$TYCHO_SOURCE"
          for tree in upstream-surefire upstream-tycho; do
            test -z "$(git -C "$tree" status --porcelain=v1 --untracked-files=all)"
          done
          patches="$GITHUB_WORKSPACE/correction/tests/m3/surefire356-authentic"
          test "$(git hash-object "$patches/StatelessXmlReporterTest.patch")" = 5b23ef250a33a4d346d0f4e4cf8e42bb7f92a814
          test "$(git hash-object "$patches/StatelessXmlReporter.patch")" = 96ba1e191f602e44cd8281f6baa74c909615b2cd
          reporter=maven-surefire-common/src/main/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporter.java
          regression=maven-surefire-common/src/test/java/org/apache/maven/plugin/surefire/report/StatelessXmlReporterTest.java
          cd upstream-surefire
          printf '%s  %s\n' \
            42b24e48035ed5e5e6dea2d960b38ef6a92faee6c1caf8234fdc74cc79fa57f8 "$reporter" \
            83b5c60d098b7f5c29a607e7049742dac4930b6a9c640e38f32d844b66cc6088 "$regression" \
            | sha256sum --check --status
          for patch in StatelessXmlReporterTest.patch StatelessXmlReporter.patch; do
            git apply --check "$patches/$patch"
            git apply "$patches/$patch"
          done
          printf '%s  %s\n' \
            06235aefe3e27f0c4b5a1d8e1ebff471c4f445d48bb54e487b6c0fd6d004fdfd "$reporter" \
            df96bf5d72924e0a472f5ea96b404469b90fd66f6f12e51c11edd4236a73a053 "$regression" \
            | sha256sum --check --status
          test "$(git diff --name-only)" = "$(printf '%s\n%s' "$reporter" "$regression")"
          git diff --check
      - name: Build the corrected reporter and run its complete JUnit class
        run: |
          set -euo pipefail
          if ! mvn -B -ntp -f upstream-surefire/pom.xml -Dmaven.repo.local="$PRODUCER_M2" \
              -pl maven-surefire-common -am '-Dtest=StatelessXmlReporterTest' \
              -Dsurefire.failIfNoSpecifiedTests=false package > "$PRODUCER_OUT/surefire-package.log" 2>&1; then
            tail -n 120 "$PRODUCER_OUT/surefire-package.log"
            exit 1
          fi
          cp upstream-surefire/maven-surefire-common/target/surefire-reports/TEST-org.apache.maven.plugin.surefire.report.StatelessXmlReporterTest.xml \
            "$PRODUCER_OUT/reporter-junit.xml"
          python3 - <<'PY'
          import gzip, hashlib, os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path(os.environ['PRODUCER_OUT'], 'reporter-junit.xml')
          data = report.read_bytes()
          root = ET.fromstring(data)
          cases = list(root.iter('testcase'))
          declared = tuple(root.get(k) for k in ('tests', 'errors', 'failures', 'skipped'))
          assert declared == ('12', '0', '0', '0'), root.attrib
          assert len(cases) == 12, len(cases)
          assert sum(c.get('name') == 'testCountsRepeatedMethodNameInvocationsInXml' for c in cases) == 1
          assert all(c.find(k) is None for c in cases for k in ('error', 'failure', 'skipped'))
          # Keep the raw bytes, compressed, so no *.xml report collector counts
          # Surefire's own tests as EMF tests.
          report.with_suffix('.xml.gz').write_bytes(gzip.compress(data, mtime=0))
          report.unlink()
          print('Corrected reporter: 12 of 12 StatelessXmlReporterTest cases passed, including the regression;'
                ' raw XML SHA-256 ' + hashlib.sha256(data).hexdigest())
          PY
          mvn -B -ntp -N -f upstream-surefire/pom.xml -Dmaven.repo.local="$PRODUCER_M2" \
            org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$PWD/upstream-surefire/maven-surefire-common/target/maven-surefire-common-3.5.6.jar" \
            -DpomFile="$PWD/upstream-surefire/maven-surefire-common/pom.xml" -DgeneratePom=false \
            > "$PRODUCER_OUT/common-install.log" 2>&1
      - name: Rebuild the unchanged Tycho booter around the corrected reporter
        run: |
          set -euo pipefail
          if ! mvn -B -ntp -f upstream-tycho/tycho-surefire/org.eclipse.tycho.surefire.osgibooter/pom.xml \
              -Dmaven.repo.local="$PRODUCER_M2" clean install > "$PRODUCER_OUT/tycho-booter-build.log" 2>&1; then
            tail -n 120 "$PRODUCER_OUT/tycho-booter-build.log"
            exit 1
          fi
          test -z "$(git -C upstream-tycho status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import gzip, hashlib, json, os, shutil, zipfile
          from pathlib import Path
          out, repo = Path(os.environ['PRODUCER_OUT']), Path(os.environ['PRODUCER_M2'])
          cls = 'org/apache/maven/plugin/surefire/report/StatelessXmlReporter.class'
          def identity(path):
              with zipfile.ZipFile(path) as jar:
                  reporter = hashlib.sha256(jar.read(cls)).hexdigest()
              return {'jar_sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'reporter_sha256': reporter}
          common = identity(repo / 'org/apache/maven/surefire/maven-surefire-common/3.5.6/maven-surefire-common-3.5.6.jar')
          module = Path('upstream-tycho/tycho-surefire/org.eclipse.tycho.surefire.osgibooter')
          built = module / 'target/org.eclipse.tycho.surefire.osgibooter-5.0.4.jar'
          booter = identity(built)
          installed = repo / 'org/eclipse/tycho/org.eclipse.tycho.surefire.osgibooter/5.0.4/org.eclipse.tycho.surefire.osgibooter-5.0.4.jar'
          pom = hashlib.sha256((module / 'pom.xml').read_bytes()).hexdigest()
          expected_reporter = os.environ['REPORT_PRODUCER_REPORTER_SHA256']
          if common['reporter_sha256'] != expected_reporter or booter['reporter_sha256'] != expected_reporter:
              raise SystemExit(f'Reporter bytes differ from the qualified producer: {common} {booter}')
          if booter['jar_sha256'] != os.environ['REPORT_PRODUCER_BOOTER_SHA256']:
              raise SystemExit(f'Booter bytes differ from the qualified producer (re-qualify before use): {booter}')
          if hashlib.sha256(installed.read_bytes()).hexdigest() != booter['jar_sha256']:
              raise SystemExit('Installed booter differs from the built booter')
          if pom != os.environ['REPORT_PRODUCER_POM_SHA256']:
              raise SystemExit('Unexpected booter POM ' + pom)
          shutil.copyfile(built, out / built.name)
          shutil.copyfile(module / 'pom.xml', out / 'org.eclipse.tycho.surefire.osgibooter-5.0.4.pom')
          junit = hashlib.sha256(gzip.decompress((out / 'reporter-junit.xml.gz').read_bytes())).hexdigest()
          record = {'correction_source': os.environ['CORRECTION_SOURCE'], 'surefire_source': os.environ['SUREFIRE_SOURCE'],
                    'tycho_source': os.environ['TYCHO_SOURCE'], 'common': common, 'booter': booter,
                    'booter_pom_sha256': pom, 'reporter_junit_xml_sha256': junit}
          (out / 'producer.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, indent=2))
          PY
          {
            java -version 2>&1
            mvn -version
          } > "$PRODUCER_OUT/toolchain.txt"
      - name: Upload the qualified report producer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-producer-surefire356-tycho504
          if-no-files-found: error
          path: ${{ runner.temp }}/report-producer/

  verify:
    needs: report-producer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # These Java/target pairs are also maintained by the Jenkins build.
          - { java: 21, target: '2026-09' }
          - { java: 25, target: '2026-12' }
    name: Java ${{ matrix.java }} Target ${{ matrix.target }} verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared test-report verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: 1202ab304c3b81b73b628d201b987941d16c94d2
          path: .release-tools/swt
          sparse-checkout: tools/release/readiness.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Keep the verifier outside the product reactor
        run: |
          mv .release-tools/swt "$RUNNER_TEMP/swt-release-tools"
          rmdir .release-tools
          test "$(git -C "$RUNNER_TEMP/swt-release-tools" rev-parse HEAD)" = 1202ab304c3b81b73b628d201b987941d16c94d2
      - name: Set up test-report validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          mvn-toolchain-id: JavaSE-${{ matrix.java }}
          cache: maven
      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.9.12
      - name: Download the qualified report producer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report-producer-surefire356-tycho504
          path: ${{ runner.temp }}/report-producer
      - name: Install the qualified report producer for this build
        working-directory: ${{ runner.temp }}/report-producer
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          for name, key in (('org.eclipse.tycho.surefire.osgibooter-5.0.4.jar', 'REPORT_PRODUCER_BOOTER_SHA256'),
                            ('org.eclipse.tycho.surefire.osgibooter-5.0.4.pom', 'REPORT_PRODUCER_POM_SHA256')):
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if actual != os.environ[key]:
                  raise SystemExit(f'Refused report producer {name}: {actual}')
          PY
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile=org.eclipse.tycho.surefire.osgibooter-5.0.4.jar \
            -DpomFile=org.eclipse.tycho.surefire.osgibooter-5.0.4.pom
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          jar = Path.home() / '.m2/repository/org/eclipse/tycho/org.eclipse.tycho.surefire.osgibooter/5.0.4/org.eclipse.tycho.surefire.osgibooter-5.0.4.jar'
          if hashlib.sha256(jar.read_bytes()).hexdigest() != os.environ['REPORT_PRODUCER_BOOTER_SHA256']:
              raise SystemExit('Installed report producer differs: ' + str(jar))
          print('Installed qualified report producer ' + str(jar))
          PY
      - name: Install display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libgtk-3-dev xvfb
      - name: Record source and toolchains
        run: |
          {
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            java -version 2>&1
            mvn -version
            git -C "$RUNNER_TEMP/swt-release-tools" rev-parse HEAD
            python -c 'import hashlib, os; from pathlib import Path; p = Path(os.environ["RUNNER_TEMP"]) / "swt-release-tools/tools/release/readiness.py"; print("REPORT_PARSER_SHA256=" + hashlib.sha256(p.read_bytes()).hexdigest())'
            echo "REPORT_PRODUCER_CORRECTION_SOURCE=$CORRECTION_SOURCE"
            echo "REPORT_PRODUCER_SUREFIRE_SOURCE=$SUREFIRE_SOURCE"
            echo "REPORT_PRODUCER_TYCHO_SOURCE=$TYCHO_SOURCE"
            echo "REPORT_PRODUCER_BOOTER_SHA256=$REPORT_PRODUCER_BOOTER_SHA256"
            echo "REPORT_PRODUCER_REPORTER_SHA256=$REPORT_PRODUCER_REPORTER_SHA256"
          } > "$RUNNER_TEMP/emf-source.txt"
      - name: Build and test the existing reactor
        run: |
          xvfb-run -a mvn -V -B -ntp --fail-at-end clean verify \
            -Dtarget-platform=${{ matrix.target }} -DjavaVersion=${{ matrix.java }} \
            -Dbuild.id="$(date -u +%Y%m%d%H%M)" -Dcommit.id="$(git rev-parse HEAD)" \
            -Dbuild.type=nightly -Dpromote=false -DECLIPSE_SIGN=false \
            -Dorg.eclipse.justj.p2.manager.args= \
            -Dtycho.baseline.replace=none -Dtycho.localArtifacts=ignore \
            -DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false \
            -DfailIfNoTests=true
      - name: Require successful executed tests from every test bundle
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path(os.environ['RUNNER_TEMP']) / 'swt-release-tools/tools/release/readiness.py'
          spec = importlib.util.spec_from_file_location('swt_readiness', source)
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          namespace = {'m': 'http://maven.apache.org/POM/4.0.0'}
          test_bundles = []
          for pom in sorted(Path('tests').glob('*/pom.xml')):
              if ET.parse(pom).getroot().findtext('m:packaging', namespaces=namespace) == 'eclipse-test-plugin':
                  test_bundles.append(pom.parent)
          if not test_bundles:
              raise SystemExit('No EMF test bundles found')
          seen_files = set()
          for bundle in test_bundles:
              counts = verifier.junit_report(bundle / 'target/surefire-reports', seen_files)
              if counts['failures'] or counts['errors']:
                  raise SystemExit('Failed tests: ' + str(bundle))
              print(json.dumps({'bundle': str(bundle), **counts}))
          PY
      - name: Require that every test runtime used the qualified report producer
        run: |
          python - <<'PY'
          import hashlib, os, re, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          local = Path.home() / '.m2/repository/org/eclipse/tycho/org.eclipse.tycho.surefire.osgibooter/5.0.4/org.eclipse.tycho.surefire.osgibooter-5.0.4.jar'
          cls = 'org/apache/maven/plugin/surefire/report/StatelessXmlReporter.class'
          booter, reporter = os.environ['REPORT_PRODUCER_BOOTER_SHA256'], os.environ['REPORT_PRODUCER_REPORTER_SHA256']
          if hashlib.sha256(local.read_bytes()).hexdigest() != booter:
              raise SystemExit('Local report producer changed during the build: ' + str(local))
          prefix, marker = 'reference:file:', '/org.eclipse.tycho.surefire.osgibooter/5.0.4/'
          namespace = {'m': 'http://maven.apache.org/POM/4.0.0'}
          bundles = [pom.parent for pom in sorted(Path('tests').glob('*/pom.xml'))
                     if ET.parse(pom).getroot().findtext('m:packaging', namespaces=namespace) == 'eclipse-test-plugin']
          if not bundles:
              raise SystemExit('No EMF test bundles found')
          for bundle in bundles:
              inis = [p for p in (bundle / 'target/work').rglob('config.ini') if p.parent.name == 'configuration']
              if len(inis) != 1:
                  raise SystemExit(f'Expected one OSGi test runtime configuration for {bundle}: {inis}')
              # Tycho writes osgi.bundles with java.util.Properties escapes (reference\:file\:...).
              lines = re.sub(r'\\(.)', r'\1', inis[0].read_text(encoding='iso-8859-1')).splitlines()
              values = [line.split('=', 1)[1] for line in lines if line.startswith('osgi.bundles=')]
              if len(values) != 1:
                  raise SystemExit(f'Expected one osgi.bundles entry in {inis[0]}')
              locations = (item.split('@', 1)[0] for item in values[0].split(','))
              used = {Path(loc[len(prefix):]).resolve() for loc in locations if loc.startswith(prefix) and marker in loc}
              if len(used) != 1:
                  raise SystemExit(f'Expected one Tycho booter in {inis[0]}: {sorted(map(str, used))}')
              path = used.pop()
              with zipfile.ZipFile(path) as jar:
                  embedded = hashlib.sha256(jar.read(cls)).hexdigest()
              if hashlib.sha256(path.read_bytes()).hexdigest() != booter or embedded != reporter:
                  raise SystemExit(f'{bundle} test runtime did not use the qualified report producer: {path}')
              print(f'{bundle}: OSGi test runtime booter {path} is the qualified report producer')
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-java-${{ matrix.java }}-target-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          path: tests/**/target/surefire-reports/*.xml
      - name: Upload source and toolchains
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-java-${{ matrix.java }}-target-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/emf-source.txt
      - name: Keep the qualified report producer out of the shared Maven cache
        if: always()
        run: |
          python -c 'import shutil; from pathlib import Path; shutil.rmtree(Path.home() / ".m2/repository/org/eclipse/tycho/org.eclipse.tycho.surefire.osgibooter/5.0.4", ignore_errors=True)'
